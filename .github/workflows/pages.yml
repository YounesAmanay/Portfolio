name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch today is the feature branch; `main` is
    # listed too so this keeps working after a rename or merge.
    branches:
      - main
      - claude/robot-arena-game-design-3pntj7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins, and an in-flight deploy is
# allowed to finish rather than being cancelled half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Refuse to ship a broken build: the same gates CI runs.
      - run: npm run typecheck
      - run: npx vitest run

      - run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
